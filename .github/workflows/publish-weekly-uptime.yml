name: Publish weekly uptime

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-weekly-uptime
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      actions: write
      contents: write
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate weekly archive
        id: publish
        run: echo "path=$(bun scripts/weekly/publish.ts)" >> "$GITHUB_OUTPUT"
      - name: Validate one-file publication
        env:
          GENERATED_PATH: ${{ steps.publish.outputs.path }}
        run: |
          case "$GENERATED_PATH" in
            content/uptime/[0-9][0-9][0-9][0-9]-W[0-9][0-9].json) ;;
            *) echo "unexpected generated path" >&2; exit 1 ;;
          esac
          test "$(git status --short | wc -l | tr -d ' ')" = "1"
          git status --short | rg '^\?\? content/uptime/[0-9]{4}-W[0-9]{2}\.json$'
          git diff --check
          git add -- "$GENERATED_PATH"
          git diff --cached --check
      - name: Push reviewed publication branch
        env:
          GENERATED_PATH: ${{ steps.publish.outputs.path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          week="$(basename "$GENERATED_PATH" .json)"
          branch="automation/uptime-$week"
          write_summary() {
            {
              echo "### Weekly uptime archive ready"
              echo
              echo "- Branch: $branch"
              echo "- Open PR: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
            write_summary
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(uptime): publish $week"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          write_summary
