name: Publish weekly uptime

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-weekly-uptime
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate weekly archive
        id: publish
        run: echo "path=$(bun scripts/weekly/publish.ts)" >> "$GITHUB_OUTPUT"
      - name: Validate one-file publication
        env:
          GENERATED_PATH: ${{ steps.publish.outputs.path }}
        run: |
          case "$GENERATED_PATH" in
            content/uptime/[0-9][0-9][0-9][0-9]-W[0-9][0-9].json) ;;
            *) echo "unexpected generated path" >&2; exit 1 ;;
          esac
          test "$(git status --short | wc -l | tr -d ' ')" = "1"
          git status --short | rg '^\?\? content/uptime/[0-9]{4}-W[0-9]{2}\.json$'
          git diff --check
          git add -- "$GENERATED_PATH"
          git diff --cached --check
      - name: Commit and push
        env:
          GENERATED_PATH: ${{ steps.publish.outputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          week="$(basename "$GENERATED_PATH" .json)"
          git commit -m "chore(uptime): publish $week"
          git push
