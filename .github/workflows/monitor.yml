name: Monitor

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-monitor
  cancel-in-progress: true

jobs:
  monitor:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check public services
        run: bun scripts/monitor/run.ts
        env:
          STATUS_INGEST_URL: ${{ vars.STATUS_INGEST_URL }}
          STATUS_INGEST_SECRET: ${{ secrets.STATUS_INGEST_SECRET }}
