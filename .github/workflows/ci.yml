name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-conventions:
    name: Repo conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Repository conventions
        run: bun run conventions:test
      - name: Commit message conventions
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.sha }}^..${{ github.sha }}"
          fi
          bun run conventions:commits -- "$range"
      - name: PR body template
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun run conventions:pr-body

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check types
        run: bun run check
      - name: Run tests
        run: bun run test
      - name: Build site
        run: bun run build
      - name: Build Worker dry run
        run: bun run cf:build
      - name: Check whitespace
        run: git diff --check

  ci-result:
    name: CI result
    if: always()
    needs:
      - repo-conventions
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail on unsuccessful CI jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo '${{ toJson(needs) }}'
          exit 1
      - name: Report CI result
        run: echo '${{ toJson(needs) }}'
